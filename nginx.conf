# daabase API reverse proxy
# Host-based routing:
#   files.daabase.click -> MinIO (:9000)  [public file storage]
#   everything else      -> engine (:8888) [realtime API, dashboard]
user www-data;
worker_processes 1;
pid /run/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_max_body_size 2g;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream daabase_engine {
    server 127.0.0.1:8888;
  }

  upstream daabase_minio {
    server 127.0.0.1:9000;
  }

  # ── Public files (S3/MinIO) ──
  server {
    listen 8080;
    server_name files.daabase.click;

    location / {
      proxy_pass http://daabase_minio;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # ── Engine (api.daabase.click, *.apps.devtik.xyz, default) ──
  server {
    listen 8080 default_server;
    server_name _;

    location / {
      proxy_pass http://daabase_engine;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
